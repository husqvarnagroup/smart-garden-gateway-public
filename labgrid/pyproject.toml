[project]
name = "labgrid-tests"
version = "0.1.0"
description = "Run tests for the Smart Garden Gateway with labgrid."
authors = [
    {name = "Lukas Woodtli",email = "lukas.woodtli@husqvarnagroup.com"}
]
license = "GPL-3.0-or-later"
requires-python = ">=3.12"

dependencies = [
    "fake-rm",
    "labgrid >=26.0,<27.0",
    "pytest >=9.1.1,<10.0.0",
    "ruff >=0.17.6,<0.18.0",
]

[tool.uv]
package = false

[tool.uv.sources]
# The dependency specification of pyproject.toml does not support relative paths.
fake-rm = { path = "../tools/fake-radio-module" }

[tool.ruff]
src = ["."]
