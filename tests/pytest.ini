[pytest]
log_cli = True
log_cli_format = %(asctime)s %(levelname)s - %(name)s:%(filename)s:%(lineno)d %(message)s
log_file_format = %(asctime)s %(levelname)s - %(name)s:%(filename)s:%(lineno)d %(message)s
# same as default of `ts` command
log_cli_date_format = %b %d %H:%M:%S
log_file_date_format = %b %d %H:%M:%S
log_level = INFO
log_cli_level = INFO
log_file_level = DEBUG

addopts = -rA

