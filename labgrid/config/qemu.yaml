# QEMU counterpart of gateway.yaml. The kernel, device tree and root
# filesystem come from the Yocto build for MACHINE = gardena-sg-qemuarm.
# Point LG_DEPLOY_DIR at that build's deploy directory, for example:
#   export LG_DEPLOY_DIR=$PWD/build-qemuarm/tmp/deploy/images/gardena-sg-qemuarm
targets:
  main:
    resources: {}
    drivers:
      - QEMUDriver:
          # qemu_bin, machine and memory are filled in by the "target"
          # fixture in conftest.py, from the build's own
          # *.qemuboot.conf, so they cannot drift from a future board or
          # image change. qemu_bin ends up as the qemu-system-arm that
          # the Yocto build produced for itself (qemu-system-native),
          # the same one scripts/runqemu.sh uses, not any system-wide
          # install, which may differ in version or build options. These
          # three are placeholders, only to satisfy QEMUDriver's
          # required fields; labgrid only substitutes BASE and LG_* in
          # !template, so the real values cannot be read from here.
          qemu_bin: ''
          machine: ''
          memory: ''
          # versatilepb's real core is an ARM926EJ-S, and runqemu does not
          # pass -cpu at all, so QEMU falls back to this machine's default.
          # labgrid's QEMUDriver has no such default and requires "cpu".
          # qemuboot.conf has no matching field, so this stays hardcoded.
          cpu: arm926
          kernel: kernel
          dtb: dtb
          nic: 'user,model=virtio-net-pci'
          # extra_args (the disk) and boot_args are also filled in by the
          # "target" fixture. The disk cannot use the driver's own
          # "disk:" key, because QEMUDriver only wires a disk for
          # vexpress-a9, pc, q35 and virt and raises NotImplementedError
          # for anything else (labgrid/driver/qemudriver.py:192).
      - ShellDriver:
          login_prompt: 'GARDENA-[0-9a-f]{6} login: '
          username: root
          # the image's PS1 prints "ERROR: <code> | " before the prompt when
          # the previous command exited non-zero
          prompt: '(?:ERROR: \d+ \| )?root@GARDENA-[0-9a-f]{6}:~# '
          login_timeout: 120
          post_login_settle_time: 2
images:
  # These two filenames match kernel_imagetype and qb_dtb in the build's
  # *.qemuboot.conf. labgrid only substitutes BASE and LG_* in !template,
  # so, unlike the QEMUDriver fields above, these cannot be read from
  # that file here; update them by hand if a future board or image
  # change renames either file.
  kernel: !template '$LG_DEPLOY_DIR/zImage'
  dtb: !template '$LG_DEPLOY_DIR/qemu-gardena-smart-gateway.dtb'
